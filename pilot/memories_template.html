<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>memhub · Memories</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--soft:#f0f2f5;--text:#1a1d24;--muted:#6b7280;--line:#e4e7ec;--accent:#3b5bdb;--accent-bg:#e9edff;
--ok:#15803d;--ok-bg:#e3f6e8;--warn:#b45309;--warn-bg:#fdf1dc;--bad:#b91c1c;--bad-bg:#fde8e8;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1217;--panel:#171b22;--soft:#1f242d;--text:#e8ebf0;--muted:#98a2b3;--line:#2b3140;--accent:#8ea2ff;--accent-bg:#1f2a52;
--ok:#6fdc8c;--ok-bg:#153322;--warn:#f0b35a;--warn-bg:#3a2b12;--bad:#ff8f8f;--bad-bg:#3d1b1b;--shadow:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:0 20px;height:56px}
.brand{font-weight:700;letter-spacing:-.01em}
.tabs{display:flex;gap:4px;height:100%}
.tab{border:0;background:none;padding:0 12px;height:100%;color:var(--muted);border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px}
.tab[aria-selected=true]{color:var(--text);border-color:var(--accent);font-weight:600}
.count{font-size:12px;background:var(--soft);border-radius:99px;padding:0 7px;color:var(--muted)}
.count.alert{background:var(--warn-bg);color:var(--warn)}
.search{margin-left:auto;width:min(320px,40vw)}
.search input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--text);font:inherit;font-size:14px}
.layout{display:grid;grid-template-columns:270px 1fr;gap:24px;max-width:1180px;margin:0 auto;padding:20px}
nav{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto}
.person{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:10px}
.person:hover{background:var(--soft)}
.person[aria-current=true]{background:var(--panel);box-shadow:var(--shadow)}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex:none}
.person .n{font-weight:500}.person .s{font-size:12.5px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn);margin-left:auto;flex:none}
main{min-width:0}
.ph{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.ph .av{width:48px;height:48px;font-size:16px}
.ph h1{margin:0;font-size:22px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13.5px}
.note{margin:14px 0 22px;padding:9px 12px;border-radius:10px;background:var(--soft);color:var(--muted);font-size:13px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:26px 0 8px;font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.rows{padding:4px 0}
.row{display:grid;grid-template-columns:130px 1fr auto;gap:12px;align-items:baseline;width:100%;text-align:left;border:0;background:none;padding:10px 16px}
.row+.row{border-top:1px solid var(--line)}
.row:hover{background:var(--soft)}
.row .k{color:var(--muted);font-size:13.5px}
.row .v{font-weight:500}
.row .m{color:var(--muted);font-size:12.5px;white-space:nowrap}
.missing{padding:10px 16px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
.chip{display:inline-block;font-size:11.5px;font-weight:600;border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:1px}
.c-warn{background:var(--warn-bg);color:var(--warn)}.c-bad{background:var(--bad-bg);color:var(--bad)}.c-ok{background:var(--ok-bg);color:var(--ok)}.c-mute{background:var(--soft);color:var(--muted)}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.topic{padding:14px 16px;text-align:left;width:100%;cursor:pointer;border:1px solid var(--line)}
.topic:hover{border-color:var(--accent)}
.topic .t{font-weight:600;display:flex;gap:8px;align-items:center}
.topic .sm{color:var(--muted);margin:6px 0 8px;font-size:14px}
.topic ul{margin:0;padding-left:18px;font-size:14px}
.topic li{cursor:pointer}.topic li:hover{text-decoration:underline}
.ai{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:auto;font-weight:500}
details.more{margin-top:8px}
details.more summary{cursor:pointer;color:var(--muted);font-size:13.5px;padding:6px 2px;list-style:none}
details.more summary::before{content:"▸ ";}details[open].more summary::before{content:"▾ ";}
.ep{display:grid;grid-template-columns:90px 1fr;gap:12px;padding:9px 16px;width:100%;text-align:left;border:0;background:none;font-size:14px}
.ep+.ep{border-top:1px solid var(--line)}.ep:hover{background:var(--soft)}
.ep .d{color:var(--muted);font-size:12.5px}
.ep .tx{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{color:var(--muted);padding:18px 16px;font-size:14px}
.list .row{grid-template-columns:1fr auto}
.list .who{color:var(--muted);font-size:12.5px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:.15s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
aside{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--panel);border-left:1px solid var(--line);z-index:50;transform:translateX(102%);transition:transform .18s;overflow:auto;padding:22px}
aside.on{transform:none}
aside .x{position:absolute;top:14px;right:14px;border:0;background:var(--soft);border-radius:8px;width:30px;height:30px}
aside .kind{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
aside h3{margin:6px 30px 14px 0;font-size:19px;line-height:1.3}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:14px 0}
.facts dt{color:var(--muted)}.facts dd{margin:0}
blockquote{margin:6px 0 0;padding:8px 12px;border-left:3px solid var(--line);background:var(--soft);border-radius:0 8px 8px 0;font-style:italic}
.hist{margin:6px 0 0;padding:0;list-style:none;font-size:14px}
.hist li{padding:6px 0;border-top:1px solid var(--line)}.hist .cur{font-weight:600}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 12px;font-size:14px}
.btn:hover{background:var(--soft)}.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--panel)}.btn.dng{color:var(--bad)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 14px;border-radius:10px;z-index:80;display:none;gap:12px;align-items:center;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast code{font:12px ui-monospace,Menlo,monospace;opacity:.85}.toast button{background:none;border:1px solid currentColor;border-radius:6px;padding:1px 8px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);padding:18px;width:min(520px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog textarea{width:100%;min-height:90px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--soft);color:var(--text);font:inherit}
dialog .r{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
@media(max-width:860px){.layout{grid-template-columns:1fr}nav{position:static;display:flex;overflow:auto;gap:4px;max-height:none}.person{width:auto;white-space:nowrap}.row{grid-template-columns:1fr auto}.row .k{grid-column:1/-1}.tabs{overflow:auto}}
</style>
</head>
<body>
<header>
  <div class="brand">memhub</div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="search"><input type="search" id="q" placeholder="Search everything…" aria-label="Search"></div>
</header>
<div class="layout" id="layout"></div>
<div class="scrim" id="scrim"></div>
<aside id="drawer" aria-label="Memory details"></aside>
<div class="toast" id="toast"></div>
<dialog id="dlg"><h3 style="margin:0 0 6px">Edit</h3>
  <p class="sub" style="margin:0 0 8px">Saving creates a new version. The current one stays in the history.</p>
  <textarea id="dlgtext"></textarea><div class="r"><button class="btn" id="dlgcancel">Cancel</button><button class="btn pri" id="dlgsave">Save</button></div></dialog>
<script>
const D = __DATA__;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ASOF = new Date(D.asof);
const days = d => Math.round((new Date(d) - ASOF) / 864e5);
const fmt = d => d ? new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}) : "";
const short = d => d ? new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"short"}) : "";
const hue = u => [...u].reduce((a,c)=>a*31+c.charCodeAt(0),7)%360;
const av = u => `<span class="av" style="background:hsl(${hue(u)} 50% 45%)">${esc(u.slice(0,2).toUpperCase())}</span>`;
const byId = Object.fromEntries(D.items.map(i=>[i.id,i]));
const local = {}; const L = id => (local[id] ||= {});
const st = {tab:"people", user:null, q:"", open:null};
const live = i => !L(i.id).deleted && !L(i.id).archived && i.status !== "archived";
const content = i => L(i.id).content ?? (i.type==="area" ? i.title : i.content);
const users = D.users;
const mine = u => D.items.filter(i=>i.user===u && live(i));
const expired = i => i.valid_until && days(i.valid_until) < 0 && i.type!=="area";
const expiring = i => i.valid_until && days(i.valid_until) >= 0 && days(i.valid_until) <= 30 && i.type!=="area";
const attention = () => D.items.filter(i=>live(i) && (expired(i)||expiring(i)||i.conflict||i.status==="candidate"));
const attnUsers = () => new Set(attention().map(i=>i.user));
const reason = i => i.conflict ? "Conflicts with another memory" : i.status==="candidate" ? "Waiting for review" : expired(i) ? `Expired ${fmt(i.valid_until)}` : `Expires ${fmt(i.valid_until)}`;
const label = i => (D.labels[i.type]||{})[i.key] || (i.key ? i.key.replace(/_/g," ").replace(/^./,c=>c.toUpperCase()) : (i.type==="profile" ? "" : i.type));

function flag(i){
  let h = "";
  if(expired(i)) h += `<span class="chip c-bad" title="Kept, but not shown to the agent">expired</span>`;
  else if(expiring(i)) h += `<span class="chip c-warn">expires ${short(i.valid_until)}</span>`;
  if(i.assertion==="inferred") h += `<span class="chip c-warn" title="Deduced, not stated">inferred</span>`;
  if(L(i.id).verified||i.verified) h += `<span class="chip c-ok">verified</span>`;
  if(i.conflict) h += `<span class="chip c-bad">conflict</span>`;
  return h;
}
const row = (k,v,m,id,extra="") => `<button class="row" data-open="${id}">${k?`<span class="k">${esc(k)}</span>`:""}<span class="v">${esc(v)}${extra}</span><span class="m">${esc(m)}</span></button>`;

function tabs(){
  const a = attention().length;
  $("#tabs").innerHTML = [["people","People",users.length],["attention","Needs attention",a],["glossary","Glossary",D.items.filter(i=>i.type==="term").length]]
    .map(([k,t,n])=>`<button class="tab" role="tab" data-tab="${k}" aria-selected="${st.tab===k}">${t}<span class="count ${k==="attention"&&n?"alert":""}">${n}</span></button>`).join("");
}

function person(u){
  const its = mine(u), by = t => its.filter(i=>i.type===t);
  const prof = by("profile"), pref = by("preference"), areas = by("area"), eps = by("episode");
  const newest = its.filter(i=>i.type!=="area").map(i=>i.observed).sort().pop();
  const slot = (t, list) => {
    const strict = D.strict[t] !== false;
    const listed = D.order[t].flatMap(k=>list.filter(i=>i.key===k));
    // open keys are suggestions: rows with another key, or none, are shown too, and nothing is listed as "not known yet"
    const extra = strict ? [] : list.filter(i=>!listed.includes(i));
    const miss = strict ? D.order[t].filter(k=>!list.find(i=>i.key===k)).map(k=>D.labels[t][k]) : [];
    return {known: [...listed, ...extra], miss};
  };
  const p = slot("profile", prof), f = slot("preference", pref);
  const block = (t, s, emptyMsg) => `<div class="card rows list">${s.known.length ? s.known.map(i=>row("",content(i),"said "+short(i.observed),i.id,flag(i))).join("") : `<div class="empty">${emptyMsg}</div>`}${s.known.length && s.miss.length ? `<div class="missing">Not known yet: ${s.miss.join(" · ")}</div>` : ""}</div>`;
  const topics = areas.map(a=>{
    const fs = its.filter(i=>i.type==="fact" && (i.areas||[]).includes(a.id));
    return `<div class="card topic" data-open="${a.id}"><div class="t"><span>${a.icon}</span>${esc(a.title)}<span class="ai" title="Written by the summarizer from the facts below">auto-summary</span></div>
      ${a.summary?`<div class="sm">${esc(a.summary)}</div>`:""}
      ${fs.length?`<ul>${fs.map(x=>`<li data-open="${x.id}">${esc(content(x))}${flag(x)}</li>`).join("")}</ul>`:`<div class="sub">No facts yet</div>`}</div>`;
  }).join("");
  const looseFacts = its.filter(i=>i.type==="fact" && !(i.areas||[]).length);
  const cases = by("case");
  const casesHtml = cases.length ? `<h2>Cases</h2>${cases.map(c=>`<div class="card topic" data-open="${c.id}"><div class="t"><span>🛠️</span>${esc(c.symptom)}<span class="ai" title="Saved on request with /remember">/remember</span></div><ul><li><b>Root cause</b> — ${esc(c.root_cause)}</li><li><b>Action</b> — ${esc(c.action)}</li><li><b>Outcome</b> — ${esc(c.outcome)}</li></ul></div>`).join("")}` : "";
  const epsHtml = eps.length ? `<details class="more"><summary>${eps.length} past conversation${eps.length>1?"s":""}</summary><div class="card">${eps.sort((a,b)=>b.observed.localeCompare(a.observed)).map(e=>`<button class="ep" data-open="${e.id}"><span class="d">${short(e.observed)}</span><span class="tx">${esc(content(e))}</span></button>`).join("")}</div></details>` : "";
  return `<div class="ph">${av(u)}<div><h1>User ${esc(u)}</h1><div class="sub">${its.length} memories · last said ${fmt(newest)}</div></div></div>
    <div class="note">Written automatically from conversations and not yet verified by a person. Click anything to see where it came from.</div>
    <h2>About</h2>${block("profile", p, "Nothing known about this person yet.")}
    <h2>Preferences</h2>${block("preference", f, "No preferences learned yet.")}
    <h2>Topics</h2>${areas.length||looseFacts.length ? `<div class="topics">${topics}</div>` : `<div class="card"><div class="empty">No topics yet. Topics appear when someone shares situations tied to visas, housing, documents and so on.</div></div>`}
    ${casesHtml}
    ${epsHtml}`;
}

function navHtml(){
  const a = attnUsers();
  return users.map(u=>{
    const its = mine(u);
    return `<button class="person" data-user="${u}" aria-current="${st.user===u}">${av(u)}<div><div class="n">User ${u}</div><div class="s">${its.some(i=>i.type==="profile"||i.type==="area") ? its.filter(i=>i.type==="profile").length+" about · "+its.filter(i=>i.type==="area").length+" topics" : "conversations only"}</div></div>${a.has(u)?`<span class="dot" title="Needs attention"></span>`:""}</button>`;
  }).join("");
}

function results(){
  const q = st.q.toLowerCase();
  const hits = D.items.filter(i=>live(i) && i.type!=="area" || i.type==="area" && live(i))
    .filter(i=>[content(i), i.quote, label(i), i.type, i.summary||"", i.user].join(" ").toLowerCase().includes(q));
  return `<div><h2 style="margin-top:0">${hits.length} result${hits.length===1?"":"s"} for “${esc(st.q)}”</h2>
    <div class="card list">${hits.map(i=>`<button class="row" data-open="${i.id}"><span class="v">${esc(content(i))}<div class="who">${esc(i.type==="profile"||i.type==="preference"?label(i):i.type)} · user ${esc(i.user||"workspace")}</div></span><span class="m">${short(i.observed)}</span></button>`).join("")||`<div class="empty">Nothing found.</div>`}</div></div>`;
}

function attentionView(){
  const a = attention();
  return `<div><h2 style="margin-top:0">Needs attention</h2><div class="card list">${a.length ? a.map(i=>`<button class="row" data-open="${i.id}"><span class="v">${esc(content(i))}<div class="who">${esc(reason(i))}${i.conflict&&byId[i.conflict]?` “${esc(content(byId[i.conflict]))}”`:""} · user ${esc(i.user)}</div></span><span class="m">${esc(label(i))}</span></button>`).join("") : `<div class="empty">Nothing needs attention right now.</div>`}</div>
    <p class="sub">Expired memories are kept but no longer shown to the agent. Conflicts and pending candidates wait for a person.</p></div>`;
}
function glossaryView(){
  const t = D.items.filter(i=>i.type==="term"&&live(i));
  return `<div><h2 style="margin-top:0">Glossary</h2><div class="card list">${t.length ? t.map(i=>`<button class="row" data-open="${i.id}"><span class="v">${esc(content(i))}</span><span class="m">${i.status}</span></button>`).join("") : `<div class="empty">No terms yet. A term is proposed when someone defines or confirms it (confirmed by the user counts as 100%), or when the model is at least 90% sure of a domain term; an admin approves it before it is used in searches.</div>`}</div></div>`;
}

function render(){
  tabs();
  const L2 = $("#layout");
  if(st.tab==="people" && !st.q){
    if(!st.user) st.user = users.slice().sort((a,b)=>mine(b).length-mine(a).length)[0];
    L2.innerHTML = `<nav>${navHtml()}</nav><main>${person(st.user)}</main>`;
  } else {
    L2.style.display = ""; L2.innerHTML = `<nav>${st.tab==="people"?navHtml():""}</nav><main>${st.q?results():st.tab==="attention"?attentionView():st.tab==="glossary"?glossaryView():""}</main>`;
  }
  drawer();
}

function drawer(){
  const i = st.open ? byId[st.open] : null, el = $("#drawer");
  $("#scrim").classList.toggle("on", !!i); el.classList.toggle("on", !!i);
  if(!i){ el.innerHTML = ""; return; }
  const loc = L(i.id), area = i.area ? byId[i.area] : null;
  const kind = i.type==="profile"||i.type==="preference" ? label(i) : i.type==="area" ? "Topic" : i.type==="fact" ? "Fact" : i.type==="episode" ? "Past conversation" : i.type==="case" ? "Case (saved with /remember)" : i.type;
  const v = i.valid_until ? (expired(i) ? `<span class="chip c-bad" style="margin:0">expired ${fmt(i.valid_until)}</span>` : `until ${fmt(i.valid_until)}`) : "no expiry";
  el.innerHTML = `<button class="x" data-close aria-label="Close">✕</button>
    <div class="kind">${esc(kind)}${area?` · in ${esc(area.title)}`:""}</div>
    <h3>${esc(content(i))}</h3>
    ${i.type==="area"&&i.summary?`<p>${esc(i.summary)} <span class="ai">auto-summary</span></p>`:""}
    ${i.type==="case"?`<dl class="facts"><dt>Symptom</dt><dd>${esc(i.symptom)}</dd><dt>Root cause</dt><dd>${esc(i.root_cause)}</dd><dt>Action</dt><dd>${esc(i.action)}</dd><dt>Outcome</dt><dd>${esc(i.outcome)}</dd></dl>`:""}
    ${i.type==="episode"&&i.situation?`<p class="sub">${esc(i.situation)}${i.outcome?` → ${esc(i.outcome)}`:""}</p>`:""}
    <dl class="facts"><dt>${i.type==="area"?"Updated":"Said"}</dt><dd>${fmt(i.observed)}</dd><dt>Valid</dt><dd>${v}</dd><dt>Seen</dt><dd>${i.seen}× ${i.assertion==="inferred"?'<span class="chip c-warn">inferred</span>':""} ${loc.verified||i.verified?'<span class="chip c-ok">verified</span>':'<span class="chip c-mute">unverified</span>'}</dd></dl>
    ${i.conflict&&byId[i.conflict]?`<div class="kind" style="margin-top:16px">Conflicts with</div><blockquote>${esc(content(byId[i.conflict]))}<div class="sub">said ${fmt(byId[i.conflict].observed)} · ${byId[i.conflict].status}</div></blockquote>`:""}
    ${i.quote?`<div class="kind">Where it came from</div><blockquote>“${esc(i.quote)}”</blockquote>`:""}
    ${i.history.length>1?`<div class="kind" style="margin-top:16px">History</div><ul class="hist">${i.history.slice().reverse().map(h=>`<li class="${h.v===i.version?"cur":""}">v${h.v} · ${esc(h.content)}<div class="sub">${h.v===i.version?"current":"replaced"} · ${fmt(h.observed)}${h.by?" · "+esc(h.by):""}</div></li>`).join("")}</ul>`:""}
    <div class="acts"><button class="btn pri" data-act="verify" ${loc.verified||i.verified?"disabled":""}>✓ Verify</button><button class="btn" data-act="edit">Edit</button><button class="btn" data-act="archive">Archive</button><button class="btn dng" data-act="delete">Delete</button></div>`;
}

function toast(msg, cmd, undo){
  const t = $("#toast"); t.innerHTML = `<span>${esc(msg)}</span>${cmd?`<code>${esc(cmd)}</code>`:""}${undo?`<button id="undo">Undo</button>`:""}`;
  t.style.display = "flex"; clearTimeout(toast.h); toast.h = setTimeout(()=>t.style.display="none", 5200);
  if(undo) $("#undo").onclick = ()=>{undo(); t.style.display="none";};
}
function go(id){ const i = byId[id]; if(i.user && st.tab==="people" && !st.q) st.user = i.user; st.open = id; render(); location.hash = `u=${i.user||""}&m=${id.slice(0,8)}`; }
function closeDrawer(){ st.open = null; drawer(); history.replaceState(null,"",location.pathname); }

document.addEventListener("click", e=>{
  const t = e.target.closest("[data-tab]"); if(t){ st.tab=t.dataset.tab; st.q=""; $("#q").value=""; st.open=null; render(); return; }
  const u = e.target.closest("[data-user]"); if(u){ st.user=u.dataset.user; st.open=null; st.tab="people"; st.q=""; $("#q").value=""; render(); return; }
  if(e.target.closest("[data-close]")||e.target.id==="scrim"){ closeDrawer(); return; }
  const o = e.target.closest("[data-open]"); if(o){ e.stopPropagation(); go(o.dataset.open); return; }
  const b = e.target.closest("[data-act]"); if(b && st.open){
    const id = st.open, loc = L(id), snap = {...loc}, cmd = id.slice(0,8), undo = ()=>{local[id]=snap; render();}, a = b.dataset.act;
    if(a==="verify"){ loc.verified=true; render(); toast("Marked as verified.", `memhub approve ${cmd}`, undo); }
    if(a==="archive"){ loc.archived=true; st.open=null; render(); toast("Archived. Kept, but hidden from the agent.", `memhub archive ${cmd}`, undo); }
    if(a==="delete"){ loc.deleted=true; st.open=null; render(); toast("Deleted permanently.", `memhub delete ${cmd}`, undo); }
    if(a==="edit"){ $("#dlgtext").value = content(byId[id]); $("#dlg").dataset.id=id; $("#dlg").showModal(); }
  }
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && st.open) closeDrawer(); });
$("#q").addEventListener("input", e=>{ st.q=e.target.value.trim(); st.open=null; render(); });
$("#dlgcancel").onclick = ()=>$("#dlg").close();
$("#dlgsave").onclick = ()=>{ const id=$("#dlg").dataset.id, v=$("#dlgtext").value.trim(); if(v){ L(id).content=v; L(id).verified=true; render(); toast("New version saved.", `memhub edit ${id.slice(0,8)} --file fields.json`); } $("#dlg").close(); };
const tm = /tab=(people|attention|glossary)/.exec(location.hash); if(tm) st.tab = tm[1];
const m = /u=([^&]*)&m=([0-9a-f]{8})/.exec(location.hash);
if(m){ const hit = D.items.find(i=>i.id.startsWith(m[2])); if(hit){ st.user = hit.user || null; st.open = hit.id; } }
render();
</script>
</body>
</html>
