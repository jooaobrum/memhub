# Habitantes example config (user scope, JSONL source, built-in types). Run every command from the repo root with -c examples/habitantes/memhub.yaml.
# Keys come from .env (OPENROUTER_API_KEY, OPENAI_API_KEY). Start Postgres: docker compose up -d
project_prefix: habitantes
memory: ./memory.md                        # what this project remembers: its types, areas and prompt
database_url: postgresql://memhub:memhub@localhost:5433/memhub
workspace_default: habitantes

llm:
  extractor: {provider: openai, model: google/gemini-2.5-flash-lite, base_url: "https://openrouter.ai/api/v1", api_key_env: OPENROUTER_API_KEY}
  judge:     {provider: openai, model: google/gemini-2.5-flash,      base_url: "https://openrouter.ai/api/v1", api_key_env: OPENROUTER_API_KEY}
embeddings:
  provider: openai
  model: text-embedding-3-small
  api_key_env: OPENAI_API_KEY
  dims: 1536

entity_types: []
scopes: [user, workspace]                 # workspace is used only by `term` (the shared glossary)

# How long a memory holds when the text gives no end date; a type's own ttl wins. null = never expires.
ttl: {stable: null, ongoing: 365d, temporary: 30d}

# The shared glossary: a term is proposed only when a message defines it explicitly, and an admin approves it.
terms: {max_per_workspace: 300, max_aliases: 5, min_confidence: 0.9}

sources:
  jsonl:
    kind: jsonl
    path: examples/habitantes/data/interactions.jsonl
    one_line_per: turn
    fields:
      thread_id: chat_id
      user_id: chat_id
      message_id: message_id
      timestamp: timestamp
      trace_id: trace_id
      user_content: user_query
      assistant_content: answer
      metadata: [intent, category, confidence, error]
    signals:
      path: examples/habitantes/data/feedback.jsonl
      join_on: {message_id: message_id, thread_id: chat_id}
      map: {rating: {down: feedback_down, up: feedback_up}}

extraction:
  remember_instructions: |
    A `/remember` order either says what to keep or points at the conversation ("save this", "save this case", "guarda isso"). In the second case read the messages ABOVE it, with their context, and keep what was just discussed. A solved problem, fault or case is a `case`: `symptom` = what was observed, `root_cause` = why it happened, `action` = what was done, `outcome` = how it ended. Take each part from the conversation (the assistant's diagnosis and steps count), never invent one: write "not stated" for a part the conversation does not give. Write each part in the third person or impersonally ("Apertou os parafusos", not "Apertei"), in the language of the conversation. Anything about who the user is, a lasting fact or how they want to be answered is a `profile`, `fact` or `preference`. Each `quote` is copied verbatim from ONE message (cite its id); `content` is your rewrite; absolute dates; utility 5, assertion `stated`; if nothing can be worked out return an empty list.
  passes: 2    # two independent samples per slice, united: a cheap model misses different facts each time
  retries: 4   # the cheap extractor truncates its JSON in ~1 of 5 calls: sample again before giving up on a segment

ingestion:
  segment_idle: 1h
  thread_close: 7d
  min_user_turns: 1
  max_candidates: 5
  segment_max_user_turns: 5
  assistant_chars: 600        # long assistant answers are shown to the extractor cut (they never carry a claim)
  repair_relative_time: true  # the judge dates "next year" / "soon" from the message date instead of dropping the claim
  verify_claims: true         # the judge checks the claims that look invented or about someone else against their quote
  verify_episodes: true      # the judge confirms the user told situation, action and outcome
  llm_correction_check: true
  skip_when: {intent: [greeting, out_of_scope]}

admission:
  weights: {utility: 0.35, evidence: 0.30, novelty: 0.20, type_prior: 0.10, signals: 0.05}
  threshold: 0.75

reconcile: {duplicate: 0.92, conflict_band: [0.80, 0.92], compare_floor: 0.30, compare_max: 4, extends: false, compare_across: [[profile, fact]]}
roles: {approve_workspace: [workspace_admin]}
retention: {dropped_days: 90}
