project_prefix: support
memory: ./memory.md                        # what this project remembers: its types, areas and prompt
database_url: ${CRM_URL}
database_schema: support_mem            # the tables live in their own schema of the project's existing database
workspace_default: default
llm:
  extractor: {provider: openai, model: google/gemini-2.5-flash-lite, base_url: "https://openrouter.ai/api/v1", api_key_env: OPENROUTER_API_KEY}
  judge:     {provider: openai, model: google/gemini-2.5-flash,      base_url: "https://openrouter.ai/api/v1", api_key_env: OPENROUTER_API_KEY}
embeddings: {provider: openai, model: text-embedding-3-small, api_key_env: OPENAI_API_KEY, dims: 1536}
scopes: [user, workspace]
sources:
  crm:
    kind: sql
    dsn_env: CRM_URL
    query: "select chat_id, msg_id, tenant, customer, ts, customer_msg, agent_msg from support_chats order by ts"
    fields: {thread_id: chat_id, message_id: msg_id, timestamp: ts, user_id: customer, workspace_id: tenant, user_content: customer_msg, assistant_content: agent_msg}
extraction:
  remember_instructions: |
    A `/remember` order either says what to keep or points at the conversation ("save this ticket"): then read the messages above. A solved problem is a `ticket` (symptom, root_cause, resolution, outcome; "not stated" if missing). Company, plan and contacts of the customer are an `account`. How they want to be answered is a `preference`; other lasting facts are a `fact`.
  retries: 4
ingestion: {segment_idle: 1h, max_candidates: 5, verify_claims: true, repair_relative_time: true}
