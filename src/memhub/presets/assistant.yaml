# Preset: a personal or coding assistant that remembers one person (user scope): profile, preferences, facts,
# episodes, cases, filed under general-purpose areas. Replace `extraction.instructions` and `areas.seeds` for your domain
# (see examples/habitantes/memhub.yaml for a fully tuned domain config).
entity_types: []
scopes:
- user
types:
  fact:
    class: memhub.types:Fact
    retrieval: search
    type_prior: 0.6
    area: optional  # filed under an area when one fits; `required` turns the areas into a domain filter
    scopes:
    - user
  profile:
    class: memhub.types:Profile
    retrieval: always
    type_prior: 0.8
    scopes:
    - user
  preference:
    class: memhub.types:Preference
    retrieval: always
    type_prior: 0.8
    max_chars: 1500
    max_active: 20
    scopes:
    - user
    keyed: true
    strict_keys: false
    keys:
      language: the language the agent should answer in
      scope: how broad or narrow the answers should be (only the main option, no follow-up questions)
      detail: how long the answers should be and how much detail they have
      format: the shape of the answers (bullets, numbered steps, a list of N items)
      emoji: whether the answers may use emoji
      tone: how formal or casual the agent is with the user
      sources: whether the answers must cite their sources
      address: what to call the user
  episode:
    class: memhub.types:Episode
    retrieval: search
    type_prior: 0.4
    ttl: 180d
    max_active: 10
    scopes:
    - user
  case:
    class: memhub.types:Case
    retrieval: search
    type_prior: 0.7
    extract: false
    on_remember: true
    scopes:
    - user
    content_template: 'Symptom: {symptom} Root cause: {root_cause} Action: {action} Outcome: {outcome}'
  area:
    class: memhub.types:Area
    retrieval: search
    extract: false
    scopes:
    - user
  skill:
    class: memhub.types:Skill
    retrieval: index_then_load
    extract: false
    scopes:
    - user
ttl:
  stable: null
  ongoing: 365d
  temporary: 30d
areas:
  open: true
  merge_similarity: 0.88
  max_per_user: 25
  max_per_workspace: 40
  page_max_items: 15
  seeds:
  - key: work
    title: Work & Projects
    icon: 💼
    description: job, role, team, employer, projects, deadlines, how the work is organised
  - key: tools_tech
    title: Tools & Tech
    icon: 🛠️
    description: languages, frameworks, libraries, infrastructure, editors, conventions the user works with
  - key: studies_learning
    title: Studies & Learning
    icon: 🎓
    description: school, degree, courses, certifications, skills being learned
  - key: home_family
    title: Home & Family
    icon: 🏠
    description: where the user lives, household, family members, pets
  - key: health
    title: Health & Diet
    icon: 🩺
    description: health constraints, allergies, diet, fitness
  - key: money
    title: Money
    icon: 🏦
    description: budget, income, banking, taxes, purchases
  - key: documents_admin
    title: Documents & Admin
    icon: 📄
    description: identity documents, permits, contracts, administrative procedures
  - key: travel
    title: Travel & Transport
    icon: 🚆
    description: trips, commuting, vehicles, travel plans with dates
  - key: hobbies
    title: Hobbies & Interests
    icon: 🎯
    description: sports, hobbies, tastes, things the user enjoys
extraction:
  remember_instructions: 'A `/remember` order either says what to keep or points at the conversation ("save this", "save this
    case"). In the second case read the messages ABOVE it, with their context, and keep what was just discussed. A solved
    problem, fault or case is a `case`: `symptom` = what was observed, `root_cause` = why it happened, `action` = what was
    done, `outcome` = how it ended. Take each part from the conversation (the assistant''s diagnosis and steps count), never
    invent one: write "not stated" for a part the conversation does not give. Write each part in the third person or impersonally
    ("Tightened the bolts", not "I tightened"), in the language of the conversation. Anything about who the user is, a lasting
    fact or how they want to be answered is a `profile`, `fact` or `preference`. Each `quote` is copied verbatim from ONE
    message (cite its id); `content` is your rewrite; absolute dates; utility 5, assertion `stated`; if nothing can be worked
    out return an empty list.

    '
  passes: 2
  retries: 4
  instructions: "KINDS. `profile` = who the user is: identity, role, where they live or work, what they study, their team,\
    \ lasting constraints and goals. One free sentence per statement, only what the user said. `fact` = other lasting knowledge\
    \ about the user's situation or environment (their projects, tools, conventions, household, commitments), filed under\
    \ an area. `episode` = something that happened to the user with a situation, what they did and how it ended. `preference`\
    \ = how the user wants the assistant to answer or to work for them. Ask of every candidate: will this help me serve this\
    \ user better in a month? If not, emit nothing.\n\nVOICE. Write `content` in the third person, in the language the user\
    \ wrote in, never in the first person and without \"The user\": \"Prefers pytest over unittest\", \"Lives in Lisbon\"\
    , not \"I prefer pytest\". Do not guess the user's gender. A statement about someone else (a child, partner, colleague,\
    \ pet) names that person: \"Daughter Alice is lactose intolerant\", never \"Is lactose intolerant\". Jokes and sarcasm\
    \ are never memories.\n\nKEEP what the USER STATED in a declarative sentence and that is still true and useful in a month:\
    \ role and employer, team, projects and the stack they use, coding conventions they want followed, where they live, studies,\
    \ family, pets, health constraints and diet, habits, budget, language level, decisions already taken, and DATED commitments\
    \ (a trip, a start date, a deadline) written with the absolute date and `valid_until` set to that date. Capture each distinct\
    \ fact (up to 5 per segment) even when the message also asks a question.\n\nNEVER emit:\n - questions, how-to requests,\
    \ searches or recommendation requests (\"how do I configure X?\", \"looking for a good gym\") and \"The user asked / wants\
    \ to know / is looking for ...\".\n - something deduced from the topic of a question (asking about Paris rents does not\
    \ mean the user lives in Paris).\n - facts that only appear in the assistant's answers.\n - vague intentions (\"I'm thinking\
    \ of\", \"maybe I'll\") - keep only a durable fact behind them, if any.\n - an acute one-off errand (a lost card, a single\
    \ bug being fixed right now).\n - something too thin to be useful (\"Works\", \"Has a project\"): keep it only with the\
    \ concrete detail (which job, which project, which tool).\nIf in doubt, emit nothing: an empty list is a good answer.\n\
    \nTIME. Every message shows its date, e.g. [#3 2026-07-21]. Never write relative time (\"next year\", \"recently\", \"\
    soon\", \"now\") in `content`: rewrite it with the date of the message that says it (\"next year\" said on 2026-07-21\
    \ -> \"in 2027\") or drop it. A fact whose text gives an end gets `valid_until` = the last day of that period.\n\nEPISODES\
    \ are rare: only when the user told the situation, what they did and the outcome. What the assistant answered is never\
    \ an outcome. A question is never an episode.\n\nPREFERENCES. Store one when the user asks for a way of working or answering\
    \ (\"keep answers short\", \"always use type hints\", \"no emoji\", \"call me Sam\"), or praises a format (\"perfect,\
    \ keep it this short\"). A request that only concerns the current answer (\"this time give me details\") is not a preference.\
    \ Set `key` to one of the suggested keys when it fits, otherwise a short snake_case name of your own; one row per key,\
    \ the latest wins. Write `content` as a complete sentence saying what is wanted. A request covering two things gives two\
    \ memories.\n\nEXAMPLES (illustrations only: never emit a memory from them)\n user: \"I'm the tech lead on the payments\
    \ API, we deploy on Fly.io. How do I set secrets there?\" -> profile \"Tech lead on the payments API.\" and fact \"The\
    \ payments API is deployed on Fly.io.\" Drop the question.\n user: \"Moved from Lyon to Annecy last month.\" (dated 2026-05-02)\
    \ -> profile \"Lives in Annecy since around April 2026.\"\n user: \"Please never use print for logging, we use structlog.\"\
    \ -> preference (key `logging`) \"Wants structlog for logging, never print.\"\n user: \"What's a good restaurant around\
    \ here?\" -> NOTHING.\n user: \"I'm thinking about learning Rust.\" -> NOTHING.\n\nQuote verbatim from a user message.\
    \ Never use `assertion: inferred`. Utility (1-5): 5 = a constraint the assistant must respect in almost every answer (an\
    \ allergy, a required convention, a format they asked for, where they live); 4 = another lasting circumstance (job, project,\
    \ stack, family, dated commitment); 3 = mildly useful (a hobby, a taste); 1-2 = trivia."
ingestion:
  segment_idle: 1h
  thread_close: 7d
  min_user_turns: 1
  max_candidates: 5
  segment_max_user_turns: 5
  assistant_chars: 600
  repair_relative_time: true
  verify_claims: true
  verify_episodes: true
  llm_correction_check: true
  skip_when:
    intent:
    - greeting
    - out_of_scope
admission:
  weights:
    utility: 0.35
    evidence: 0.3
    novelty: 0.2
    type_prior: 0.1
    signals: 0.05
  threshold: 0.75
reconcile:
  duplicate: 0.92
  conflict_band:
  - 0.8
  - 0.92
  compare_floor: 0.3
  compare_max: 4
  extends: false
  compare_across:
  - - profile
    - fact
roles:
  approve_workspace:
  - workspace_admin
retention:
  dropped_days: 90
