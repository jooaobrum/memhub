# Preset: a customer-support agent. Facts about a customer's account (workspace) and how each customer wants answers (user).
# Built from examples/support; use it with `preset: support` and edit with a `types:` block.
scopes:
- user
- workspace
types:
  account:
    fields:
      company:
        type: str
        description: the customer's company
      plan:
        type: str?
        description: subscription plan, if said
      contact:
        type: str?
        description: admin or main contact person
    content_template: '{company} - plan {plan}, contact {contact}'
    scopes:
    - workspace
    retrieval: search
  preference:
    class: memhub.types:Preference
    retrieval: always
    keyed: true
    strict_keys: false
    keys:
      language: language of the answers
      detail: length of the answers
    scopes:
    - user
  ticket:
    fields:
      symptom:
        type: str
        description: what the customer observed
      root_cause:
        type: str
      resolution:
        type: str
        description: what fixed it
      outcome:
        type: str
    content_template: 'Symptom: {symptom} Root cause: {root_cause} Resolution: {resolution} Outcome: {outcome}'
    extract: false
    on_remember: true
    scopes:
    - workspace
  fact:
    class: memhub.types:Fact
    retrieval: search
    scopes:
    - workspace
extraction:
  remember_instructions: 'A `/remember` order either says what to keep or points at the conversation ("save this ticket"):
    then read the messages above. A solved problem is a `ticket` (symptom, root_cause, resolution, outcome; "not stated" if
    missing). Company, plan and contacts of the customer are an `account`. How they want to be answered is a `preference`;
    other lasting facts are a `fact`.

    '
  instructions: 'Customer-support agent. Keep durable facts the customer states about their company, account, setup and integrations
    (account, fact) and how they want answers (preference). Never keep questions, one-off requests or what the agent says.
    Write `content` as your own third-person sentence ("Wants every answer in Spanish"), never the
    customer''s words copied as they are; the verbatim words go in the evidence quote.

    '
  retries: 4
ingestion:
  segment_idle: 1h
  max_candidates: 5
  verify_claims: true
  repair_relative_time: true
