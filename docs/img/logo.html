<!doctype html>
<html><head><meta charset="utf-8"><title>memhub logo</title>
<!-- Icon + wordmark lockup, rendered by render.py to logo.png on a transparent background. The lockup is centred on a
     wide canvas so the README shows it centred even where `align` is ignored. The two blues keep at least
     3:1 contrast on white and on dark themes, so one image works everywhere (no light/dark variants). -->
<style>
*{margin:0;padding:0}
body{background:transparent;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;padding:20px}
.lockup{width:1000px;display:flex;justify-content:center;align-items:center;gap:20px;padding:10px 0}
.lockup img{width:92px;height:92px}
.word{font-size:68px;font-weight:700;letter-spacing:-1.5px;line-height:1;color:#2563eb}
.word i{font-style:normal;color:#4f8ff7}
</style></head><body>
<div class="lockup" id="logo"><img src="logo.svg" alt=""><span class="word">mem<i>hub</i></span></div>
</body></html>
