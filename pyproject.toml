[project]
name = "memhub"
version = "0.1.0"
description = "Reviewed, typed, versioned long-term memory for agents"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "psycopg[binary]>=3.1",
  "psycopg-pool>=3.2",
  "pgvector>=0.2.5",
  "typer>=0.12",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "langchain-core>=1.0",
  "langchain>=1.0",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.2"]
anthropic = ["langchain-anthropic>=0.2"]
google = ["langchain-google-genai>=2.0"]
bedrock = ["langchain-aws>=0.2"]
ollama = ["langchain-ollama>=0.2"]
mistral = ["langchain-mistralai>=0.2"]
mlflow = ["mlflow>=2.14"]
sqlite = ["sqlite-vec>=0.1.6"]
mcp = ["mcp>=2.0,<3"]
dev = [
  "hatchling",  # the packaging test builds a wheel
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "sqlite-vec>=0.1.6",
  "mcp>=2.0,<3",
  "langchain>=1.4.6",  # examples/review_inline: per-call human-in-the-loop interrupts
]

[project.scripts]
memhub = "memhub.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memhub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
